<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    {% include seo.html %}
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="{{ '/images/favicon.svg' | relative_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/home.css' | relative_url }}">
    <script src="{{ '/assets/js/home.js' | relative_url }}"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="home-shell">
      <header class="home-header">
        <a class="university-link" href="https://www.pku.edu.cn/">Peking University</a>
        <button class="theme-toggle" type="button" aria-label="Switch to dark mode" hidden>
          <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20.5 13A8.5 8.5 0 0 1 11 3.5 8.5 8.5 0 1 0 20.5 13Z"/></svg>
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
        </button>
      </header>

      <main id="main">
        {{ content }}
      </main>

      <footer class="home-footer">
        <p>&copy; {{ site.time | date: '%Y' }} {{ site.name }}</p>
        <div class="footer-links">
          <a href="{{ '/sitemap/' | relative_url }}">Sitemap</a>
          <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
          <span>Built with <a href="https://jekyllrb.com/">Jekyll</a> &amp; <a href="https://github.com/academicpages/academicpages.github.io">AcademicPages</a></span>
        </div>
      </footer>
    </div>
  </body>
</html>
