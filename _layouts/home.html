<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    {% include seo.html %}
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="{{ '/images/favicon.svg' | relative_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/home.css' | relative_url }}">
    <script src="{{ '/assets/js/home.js' | relative_url }}"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="home-shell">
      <main id="main">
        {{ content }}
      </main>

      <footer class="home-footer">
        <p>Last updated: {{ site.time | date: '%B %Y' }}</p>
        <button class="theme-toggle" type="button" aria-label="Switch to dark mode" hidden>Dark mode</button>
      </footer>
    </div>
  </body>
</html>
